# Mirror automatico GitLab -> GitHub
stages:
  - mirror

mirror_to_github:
  stage: mirror
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh-client
    - git config --global user.email "mirror@gitlab.com"
    - git config --global user.name "GitLab Mirror"
    - git config --global http.postBuffer 524288000
  script:
    - echo "Configurando remote de GitHub..."
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://JuanmaSssj:${GITHUB_TOKEN}@github.com/JuanmaSssj/sports-predictor.git"
    - echo "Haciendo fetch completo..."
    - git fetch --unshallow 2>/dev/null || git fetch --all
    - echo "Pusheando a GitHub..."
    - git push github HEAD:main --force
    - echo "Mirror completado exitosamente!"
  only:
    - main
  allow_failure: false
